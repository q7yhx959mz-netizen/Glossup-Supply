<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop - GlossUp</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>Shop GlossUp</h1>

  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="cart.html">Cart</a>
  </nav>
</header>

<section class="products">

  <div class="card">
    <h3>Lip Gloss</h3>
    <p>$12</p>
    <button onclick="addToCart('Lip Gloss', 12)">Add to Cart</button>
  </div>

  <div class="card">
    <h3>Lashes</h3>
    <p>$18</p>
    <button onclick="addToCart('Lashes', 18)">Add to Cart</button>
  </div>

  <div class="card">
    <h3>Glow Serum</h3>
    <p>$24</p>
    <button onclick="addToCart('Glow Serum', 24)">Add to Cart</button>
  </div>

</section>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBXS_vMwSa58ymxcnExiNWBY022iXH366o",
  authDomain: "glossup-supply.firebaseapp.com",
  projectId: "glossup-supply",
  storageBucket: "glossup-supply.firebasestorage.app",
  messagingSenderId: "757191546014",
  appId: "1:757191546014:web:397c8a774e71585c76978f"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// THIS replaces your old localStorage cart
window.addToCart = async function(name, price) {

  try {
    await addDoc(collection(db, "cart"), {
      name: name,
      price: price,
      createdAt: Date.now()
    });

    alert(name + " added to Firebase cart!");

  } catch (error) {
    console.error("Error adding to cart:", error);
  }

};

</script>
</body>
</html>
